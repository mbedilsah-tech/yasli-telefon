name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Uygulamayı derle
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK dosyasını hazırla
        run: cp app/build/outputs/apk/release/app-release.apk YasliTelefon.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sürüm ${{ github.run_number }}
          files: YasliTelefon.apk
          make_latest: true
